name: Build Release APK

# Manual trigger + on every push to master. Adjust as you like.
on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Injects your own Telegram API credentials (from my.telegram.org) into
      # BuildVars.java in place of the placeholder values that ship in the
      # public repo. Requires the API_ID and API_HASH secrets below.
      - name: Set API_ID / API_HASH
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::API_ID and/or API_HASH secrets are not set. Get your own credentials at https://my.telegram.org and add them as repo secrets."
            exit 1
          fi
          BUILD_VARS=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/public static int APP_ID = .*/public static int APP_ID = ${API_ID};/" "$BUILD_VARS"
          sed -i "s/public static String APP_HASH = \".*\";/public static String APP_HASH = \"${API_HASH}\";/" "$BUILD_VARS"
          grep -n "APP_ID\|APP_HASH" "$BUILD_VARS"

      # Optional: use your own release keystore instead of the repo's bundled
      # debug-style keystore (TMessagesProj/config/release.keystore, password
      # "android"). Only runs if you've added the secrets below in
      # Settings -> Secrets and variables -> Actions.
      - name: Decode custom release keystore (optional)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore

      - name: Build release APK (afat = arm64-v8a only)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            ${RELEASE_STORE_PASSWORD:+-PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"} \
            ${RELEASE_KEY_ALIAS:+-PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS"} \
            ${RELEASE_KEY_PASSWORD:+-PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"} \
            --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
